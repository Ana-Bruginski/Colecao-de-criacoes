<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body>

        <div class="salas" id="salas" role="tablist" aria-label="Salas"></div>

        <div id="sala" class="topo"></div>

    <section class="coluna" aria-label="Sobre">
        <div class="barra"><span>Ana Bruginski</span><span>Curitiba</span></div>
        <div id="perfil" class="topo"></div>
    </section>

</div>

<footer class="rodape">
    <span>© Ana Bruginski 2026</span>
    <span>Tudo que eu fiz até aqui</span>
